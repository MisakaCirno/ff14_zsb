name: Project CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * 0"

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-postgres.txt
            requirements-audit.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-audit.txt

      - name: Audit Python runtime dependencies
        run: |
          python -m pip_audit -r requirements.txt --progress-spinner off
          python -m pip_audit -r requirements-postgres.txt --progress-spinner off

      - name: Audit frontend runtime dependencies
        run: >-
          npm audit --prefix frontend --omit=dev --audit-level=high
          --registry=https://registry.npmjs.org

  verify-windows:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret-key-with-enough-length-for-django-system-checks
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CSRF_TRUSTED_ORIGINS: http://localhost

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify project
        shell: powershell
        run: .\verify.ps1 -Profile Full -DjangoParallel 4 -PythonExecutable python

  verify-postgresql:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ffxivshare
          POSTGRES_USER: ffxivshare
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ffxivshare -d ffxivshare"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret-key-with-enough-length-for-django-system-checks
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CSRF_TRUSTED_ORIGINS: http://localhost
      DATABASE_ENGINE: postgresql
      DATABASE_NAME: ffxivshare
      DATABASE_USER: ffxivshare
      DATABASE_PASSWORD: ci-database-password
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_SSLMODE: disable

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-postgres.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-postgres.txt

      - name: Verify project on PostgreSQL
        shell: pwsh
        run: .\verify.ps1 -Profile Fast -DjangoParallel 4 -PythonExecutable python

  verify-release-windows:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret-key-with-enough-length-for-django-system-checks
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CSRF_TRUSTED_ORIGINS: http://localhost

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Chromium for release browser checks
        working-directory: frontend
        run: npx playwright install chromium

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify release contracts
        shell: powershell
        run: .\verify.ps1 -Profile Release -DjangoParallel 4 -PythonExecutable python
