{% extends 'base.html' %}

{% block title %}页面未找到 - 404{% endblock %}

{% block content %}
<section class="static-page static-page--narrow" aria-labelledby="not-found-title">
    <div class="ui-panel not-found">
        <i class="bi bi-signpost-split not-found__icon" aria-hidden="true"></i>
        <p class="not-found__code" aria-hidden="true">404</p>
        <h1 class="ui-page-title not-found__title" id="not-found-title">页面未找到</h1>
        <p class="not-found__description">抱歉，你访问的页面不存在。如果你是通过链接来到这里，该页面可能已被取消公开或删除。</p>
        <div class="not-found__actions">
            <a href="{% url 'index' %}" class="btn btn-primary">
                <i class="bi bi-house-door" aria-hidden="true"></i>
                返回首页
            </a>
            <a href="{% url 'about' %}" class="btn btn-outline-secondary">
                <i class="bi bi-info-circle" aria-hidden="true"></i>
                了解本站
            </a>
        </div>
    </div>
</section>
{% endblock %}
