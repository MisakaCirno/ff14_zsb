{% with fragment=interaction_fragment|default:'card' %}
<button type="button"
        class="btn btn-sm {% if is_favorited %}btn-warning{% else %}btn-outline-secondary{% endif %}{% if fragment != 'detail' %} hover-lift w-50{% endif %}"
        id="btn-favorite-{{ share.share_id }}"
        hx-post="{% url 'toggle_favorite' share.share_id %}?fragment={{ fragment }}"
        hx-target="this"
        hx-swap="outerHTML"
        title="{% if is_favorited %}取消收藏{% else %}收藏{% endif %}">
    <i class="bi {% if is_favorited %}bi-star-fill{% else %}bi-star{% endif %}"></i>
    <span id="favorites-count-{{ share.share_id }}"{% if fragment == 'detail' %} class="ms-1"{% endif %}>{{ favorites_count }}</span>
</button>
{% endwith %}
